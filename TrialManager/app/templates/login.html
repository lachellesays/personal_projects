{% extends "base.html" %}
{% block title %}Sign in · Trial Manager{% endblock %}
{% block auth %}
<h1>Trial Manager</h1>
<div class="muted">Sign in to manage your trials.</div>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
  <label class="l" for="email">Email</label><input class="f" id="email" name="email" type="email" autocomplete="username" value="{{ email }}" required autofocus>
  <label class="l" for="password">Password</label><input class="f" id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="btn primary">Sign in</button>
</form>
<p class="muted" style="margin-top:14px">Accounts are invite-only. Ask an existing admin for an invite link.</p>
{% endblock %}
