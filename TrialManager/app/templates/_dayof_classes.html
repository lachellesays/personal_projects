<label class="l">Classes</label>
{% for dd in days %}<div class="classpick"><b class="muted">{{ dd|day }}</b>
  {% for c in classes[dd] %}<label class="chk"><input type="checkbox" name="classes" value="{{ dd }}|{{ c }}"> {{ c }}</label>{% endfor %}</div>{% endfor %}
<p class="hint">Each class costs its normal fee plus {{ day_of_fee|money }}.</p>
