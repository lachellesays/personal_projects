<!doctype html>
<html><body style="margin:0;padding:0;background:#F1F5F9;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#0F172A">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F1F5F9;padding:20px 10px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border-radius:12px;overflow:hidden">
<tr><td style="background:#0F1E4A;color:#FFFFFF;padding:18px 22px">
  <div style="font-size:13px;color:#CBD5E1">{{ show.name }}</div>
  <div style="font-size:20px;font-weight:700;margin-top:2px">{{ heading }}</div>
</td></tr>
<tr><td style="padding:20px 22px;font-size:15px;line-height:1.5">
<p style="margin:0 0 12px">Hi {{ h.first_name or h.name }},</p>
{% if note %}<div style="background:#EFF6FF;border-left:4px solid #1E3A8A;padding:10px 12px;margin:0 0 14px;white-space:pre-line">{{ note }}</div>{% endif %}
